<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Ibarra+Real+Nova:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap"></noscript>
<style>
:root{--manto:#0B3237;--m2:#143A3E;--sel:#284540;--oro:#E6C27A;--oroc:#F4DCA6;--rosa:#F2B5AC;--rosad:#A8434F;--cant:#F4EDE8;--card:#FFFDFB;--line:#E5D9D0;--ink:#0E3438;--ink2:#4A6266;--txt:#F6EFE9;--txt2:#B9C7C5;--teal:#14555A;--se:'Ibarra Real Nova',Georgia,'Times New Roman',serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#071F23}
body{font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit}
#app{position:relative;max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;overflow:hidden}
.v{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:22px 22px 24px}
.d{background:radial-gradient(120% 55% at 50% 0%,#17525A 0%,#0B3237 70%);color:var(--txt)}
.l{background:var(--cant);color:var(--ink)}
.tb{padding-bottom:96px}
p{margin:0}
.ru{font-family:var(--se);font-style:italic;font-weight:500;font-size:17px;line-height:22px;color:var(--rosa)}
.l .ru{color:var(--rosad)}
h1,h2{font-family:var(--se);font-weight:600;letter-spacing:-.2px;margin:2px 0 0;text-wrap:balance}
h1{font-size:32px;line-height:38px}
h2{font-size:25px;line-height:30px}
.sub{font-size:15px;line-height:22px;margin-top:6px;color:var(--txt2)}
.l .sub{color:var(--ink2)}
.c{text-align:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:0 20px;border:0;border-radius:28px;font-weight:700;font-size:17px;cursor:pointer;text-decoration:none}
.go{background:var(--oro);color:var(--manto);box-shadow:0 10px 26px rgba(230,194,122,.2),inset 0 1px 0 rgba(255,255,255,.45)}
.go.se{font-family:var(--se);font-size:22px}
.te{background:var(--teal);color:var(--card);box-shadow:0 8px 20px rgba(20,85,90,.22),inset 0 1px 0 rgba(255,255,255,.16)}
.gh{background:none;border:1.5px solid rgba(246,239,233,.32);color:var(--txt);min-height:48px;font-weight:600;font-size:16px}
.l .gh{border-color:var(--teal);color:var(--teal)}
.sm{min-height:46px;font-size:16px}
.lk{background:none;border:0;padding:0;min-height:44px;font-weight:600;font-size:15px;text-decoration:underline;text-underline-offset:4px;cursor:pointer;color:inherit}
.btn:focus-visible,.lk:focus-visible,.ic:focus-visible,.row:focus-visible,.tab:focus-visible{outline:2px solid var(--oroc);outline-offset:3px}
.l .btn:focus-visible,.l .row:focus-visible,.l .tab:focus-visible{outline-color:var(--teal)}
.hd{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:8px}
.ic{flex:none;width:44px;height:44px;display:flex;align-items:center;border:0;background:none;color:inherit;padding:0;cursor:pointer}
.ic.r{justify-content:flex-end}
.mt{margin-top:auto}
.card{border-radius:20px;border:1px solid var(--line);background:var(--card);overflow:hidden}
.d .card{border-color:rgba(246,239,233,.16);background:var(--m2)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:10px 14px 10px 18px;border:0;background:none;color:inherit;text-align:left;cursor:pointer;font-size:16px}
.row+.row{border-top:1px solid var(--line)}
.d .row+.row{border-top-color:rgba(246,239,233,.14)}
.row b{display:block;font-weight:600;line-height:22px}
.row small{display:block;font-size:14px;line-height:20px;color:var(--ink2)}
.d .row small{color:var(--txt2)}
.row .g{flex:1;min-width:0}
.fld{width:100%;height:64px;padding:0 20px;border-radius:16px;border:1.5px solid var(--oro);background:#21403E;color:var(--txt);font-family:var(--se);font-size:26px;font-weight:600}
select.fld{font-size:22px;appearance:none;-webkit-appearance:none}
.fld:focus-visible{outline:2px solid var(--oroc);outline-offset:3px}
.lab{display:block;margin:28px 0 8px;font-size:14px;font-weight:600;color:var(--txt2)}
.tl{position:relative;list-style:none;margin:16px 0 0;padding:0 0 0 30px;display:flex;flex-direction:column;gap:10px}
.tl:before{content:"";position:absolute;left:9px;top:24px;bottom:60px;width:1px;background:#D3C5BA}
.tl li{position:relative}
.nd{position:absolute;left:-30px;top:14px;width:20px;height:20px;border-radius:10px;background:var(--cant);display:flex;align-items:center;justify-content:center}
.it{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px 12px 16px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-align:left;cursor:pointer}
.it.now{border:1.5px solid var(--teal)}
.it .ru{font-size:15px;line-height:20px}
.it b{display:block;margin-top:2px;font-family:var(--se);font-weight:600;font-size:21px;line-height:26px}
.it .g{flex:1;min-width:0}
.hero{position:relative;padding:14px 16px 16px;border-radius:20px;overflow:hidden;background:radial-gradient(130% 90% at 85% 0%,#1D626A 0%,#0B3237 72%);color:var(--txt)}
.hero .ru{color:var(--rosa);font-size:15px;line-height:20px}
.hero .sub{color:var(--txt2);margin-top:4px}
.ok{color:#2E7D5B;font-weight:700;font-size:14px}
.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;display:flex;padding:8px 8px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);z-index:5}
.tabs.dk{background:#0A2C31;border-top-color:rgba(246,239,233,.14)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px;justify-content:center;border:0;background:none;font-size:12px;font-weight:600;color:#5E7477;cursor:pointer}
.tab.on{color:var(--teal);font-weight:700}
.dk .tab{color:#A3B6B5}
.dk .tab.on{color:var(--oro)}
.pr{font-family:var(--se);font-size:19px;line-height:27px;margin-top:10px}
.pr i{color:var(--rosa);font-style:italic}
.pr.rr{color:var(--oroc);font-weight:500}
.ex{font-family:var(--se);font-style:italic;font-size:16px;line-height:23px;color:var(--txt2);margin-top:10px}
.ring{position:relative;align-self:center;width:260px;height:262px;margin-top:8px}
.ring svg{position:absolute;left:0;top:0}
.ring div{position:absolute;left:0;top:84px;width:260px;text-align:center}
.ring b{display:block;font-family:var(--se);font-weight:600;font-size:25px;line-height:30px}
.ring span{font-size:14px;color:var(--oroc)}
.sky{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
.sky svg{position:absolute}
@keyframes brillo{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.tw{animation:brillo 4.2s ease-in-out infinite}
@keyframes pulso{0%{transform:scale(1);opacity:.9}70%,100%{transform:scale(2.3);opacity:0}}
.pu{animation:pulso 2.6s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes tanido{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.bell{transform-origin:50% 14%;animation:tanido 2.2s ease-in-out infinite}
@keyframes sube{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
/* Entrada de cada vista: el cielo y las barras fijas se quedan quietos; el contenido llega en cascada */
@keyframes entra{from{opacity:0;translate:0 12px}}
@keyframes entraF{from{opacity:0;translate:24px 0}}
@keyframes entraB{from{opacity:0;translate:-24px 0}}
.in>:where(:not(.sky,.tabs,.pie,.rpie)){animation:entra .48s cubic-bezier(.2,.7,.2,1) backwards}
.in.fw>:where(:not(.sky,.tabs,.pie,.rpie)){animation-name:entraF}
.in.bk>:where(:not(.sky,.tabs,.pie,.rpie)){animation-name:entraB}
.in>:nth-child(3){animation-delay:.05s}
.in>:nth-child(4){animation-delay:.1s}
.in>:nth-child(5){animation-delay:.15s}
.in>:nth-child(6){animation-delay:.2s}
.in>:nth-child(n+7){animation-delay:.25s}
@keyframes pop{from{transform:scale(.6)}}
@keyframes raya{from{transform:scaleX(0)}}
.in .tab.on svg{animation:pop .36s cubic-bezier(.3,1.6,.5,1)}
.in .dk .tab.on:before{animation:raya .3s ease-out}
.z{position:relative;z-index:1}
.days{list-style:none;display:flex;justify-content:space-between;margin:0;padding:0}
.days li{width:30px;height:30px;border-radius:15px;border:1px solid rgba(246,239,233,.28);color:#A3B6B5;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.days .dn{background:var(--oro);border-color:var(--oro);color:var(--manto);font-weight:700}
.days .cu{border:1.5px solid var(--oro);background:var(--sel);color:var(--oroc);font-weight:700;box-shadow:0 0 0 4px rgba(230,194,122,.18)}
.sw{position:relative;flex:none;width:52px;height:32px}
.sw input{position:absolute;left:0;top:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.sw span{display:block;width:52px;height:32px;border-radius:16px;background:rgba(246,239,233,.24);transition:background .2s}
.sw span:after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:13px;background:var(--txt);transition:transform .2s}
.sw input:checked+span{background:var(--oro)}
.sw input:checked+span:after{transform:translateX(20px);background:var(--manto)}
.sw input:focus-visible+span{outline:2px solid var(--oroc);outline-offset:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:15px;line-height:40px;font-weight:500}
.cal .w{font-size:13px;line-height:20px;font-weight:700;color:var(--ink2)}
.cal i{display:inline-block;width:34px;height:34px;line-height:34px;border-radius:17px;font-style:normal;font-weight:700}
.cal .hoy{background:var(--teal);color:var(--card)}
.cal .rez{background:var(--oro);color:var(--manto)}
.cal .fi{background:var(--rosad);color:var(--card)}
.st{display:flex;gap:10px;margin-top:14px}
.st div{flex:1;padding:12px 14px;border-radius:18px;border:1px solid var(--line);background:var(--card)}
.st b{display:block;font-family:var(--se);font-size:30px;line-height:34px;font-weight:600}
.st span{font-size:14px;color:var(--ink2)}
.av{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:14px;border:2px solid var(--manto);background:var(--oroc);color:var(--manto);font-size:12px;font-weight:700;margin-left:-7px}
.av:first-child{margin-left:0}
.code{font-family:var(--se);font-size:40px;font-weight:600;letter-spacing:6px;color:var(--oroc)}
.note{font-size:14px;line-height:20px;color:#A3B6B5}
.l .note{color:var(--ink2)}
.toast{position:fixed;left:0;right:0;top:calc(14px + env(safe-area-inset-top));width:max-content;max-width:min(calc(100% - 44px),386px);margin:0 auto;padding:11px 18px;border-radius:22px;background:var(--txt);color:var(--manto);font-size:14px;line-height:20px;font-weight:600;text-align:center;text-wrap:balance;z-index:9;box-shadow:0 10px 28px rgba(0,0,0,.4);animation:sube .22s ease-out}
.mapa-full{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;min-height:300px;margin-top:8px}
.mapa-full .halo{position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(230,194,122,.16),rgba(230,194,122,0));pointer-events:none}

.cuenta{position:absolute;left:26px;bottom:4%;display:flex;align-items:flex-end;gap:10px;max-width:52%}
.cuenta .num{font-family:var(--se);font-weight:600;font-size:56px;line-height:50px;color:var(--oroc)}
.cuenta p:last-child{font-size:14px;line-height:19px;color:#B9C7C5;padding-bottom:4px}

.n{--ink:#F6EFE9;--ink2:#B9C7C5;--card:#103C42;--line:rgba(244,220,166,.2);--teal:#E6C27A;--cant:#0B3237}
.n>:not(.sky):not(.tabs):not(.toast):not(.pie){position:relative;z-index:1}
.n .card,.n .it,.n .st div{background:rgba(246,239,233,.05);border-color:rgba(244,220,166,.2)}
.n .it.now{border-color:var(--oro);background:rgba(230,194,122,.08)}
.n .ok{color:#8FD9B4}
.n .nd{background:none}
.n .tl:before{display:none}
.n .tl li:not(:last-child):after{content:"";position:absolute;left:-21px;top:40px;bottom:-20px;width:1px;background:rgba(230,194,122,.32)}
.n .hero{box-shadow:inset 0 0 0 1px rgba(230,194,122,.42)}
.n .cal .hoy{background:none;box-shadow:inset 0 0 0 1.5px var(--oro);color:var(--oroc)}
.n .cal .fi{color:#fff}
h1.xl{font-size:44px;line-height:46px;letter-spacing:-.6px}
.row b{font-family:var(--se);font-size:20px;line-height:24px}
.tabs.dk{background:rgba(8,36,41,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top-color:rgba(244,220,166,.16)}
.tab{position:relative}
.dk .tab.on:before{content:"";position:absolute;top:-9px;left:50%;width:22px;height:2px;margin-left:-11px;border-radius:1px;background:var(--oro)}
.tit{display:flex;align-items:center;gap:14px;margin:28px 0 14px;font-family:var(--se);font-weight:600;font-size:12.5px;line-height:16px;letter-spacing:.22em;text-transform:uppercase;color:var(--oro);white-space:nowrap}
.tit:before,.tit:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(230,194,122,0),rgba(230,194,122,.6))}
.tit:after{background:linear-gradient(90deg,rgba(230,194,122,.6),rgba(230,194,122,0))}
.em{display:block;color:var(--oro)}
.em svg{display:block;width:100%;height:100%}
.nicho{position:relative;margin:18px 0 8px;border:1px solid rgba(230,194,122,.75);border-bottom:0;border-radius:9999px 9999px 0 0;background:#0A2B30;box-shadow:0 30px 44px -26px rgba(0,0,0,.6)}
.nicho .n1,.nicho .n2{position:absolute;border:1px solid rgba(230,194,122,.3);border-bottom:0;border-radius:9999px 9999px 0 0;pointer-events:none}
.nicho .n1{left:4px;right:4px;top:4px;bottom:0}
.nicho .n2{left:29px;right:29px;top:29px;bottom:0;border-color:rgba(230,194,122,.6);background:radial-gradient(100% 62% at 50% 22%,#1E646C 0%,#11464C 52%,#0C353A 100%)}
.nicho:after{content:"";position:absolute;left:-12px;right:-12px;bottom:-1px;height:1px;background:rgba(230,194,122,.85)}
.nicho:before{content:"";position:absolute;left:10px;right:10px;bottom:-7px;height:1px;background:rgba(230,194,122,.35)}
.nt{position:absolute;left:0;top:0;width:100%;pointer-events:none}
.nt text{font-family:var(--se);font-weight:600;font-size:12px;letter-spacing:.34em;fill:var(--oro)}
.nb{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:46px 44px 10px}
.nb .em{width:52px;height:52px}
.nb .ru{margin-top:8px}
.nb h2{font-size:36px;line-height:42px;margin:0}
.ins{margin-top:6px;font-family:var(--se);font-weight:600;font-size:12.5px;line-height:18px;letter-spacing:.2em;text-transform:uppercase;color:var(--oroc)}
.nb .btn{margin-top:16px}
.nb .lk{margin-top:2px;color:var(--txt)}
.ret{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-bottom:1px solid rgba(230,194,122,.6)}
.ni{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;padding:22px 2px 12px;border:1px solid rgba(230,194,122,.34);border-bottom:0;border-radius:9999px 9999px 0 0;background:rgba(246,239,233,.035);color:var(--txt);cursor:pointer}
.ni .em{width:32px;height:32px;margin-bottom:6px;color:var(--oroc);opacity:.85}
.ni .em svg{stroke-width:1.7px}
.ni b{font-family:var(--se);font-weight:600;font-size:14.5px;line-height:18px;letter-spacing:-.1px}
.ni small{font-size:11.5px;line-height:15px;color:var(--txt2)}
.ni.on{border-color:var(--oro);background:linear-gradient(#1D626A,#12474D)}
.ni.on .em{color:var(--oro);opacity:1}
.ni.on small{font-family:var(--se);font-style:italic;font-size:14px;color:var(--rosa)}
.ni:focus-visible{outline:2px solid var(--oroc);outline-offset:3px}
.md{flex:none;width:44px;height:44px;border-radius:22px;border:1px solid rgba(230,194,122,.45);display:flex;align-items:center;justify-content:center;color:var(--oro)}
.md svg{width:26px;height:26px;stroke-width:1.9px}
.advg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px;margin-top:20px}
.advg .ni{min-height:120px;padding:20px 4px 10px;border-bottom:1px solid rgba(230,194,122,.34)}
.advg .ni.on{border-bottom-color:var(--oro)}
.advg .ni b{display:flex;align-items:center;justify-content:center;min-height:36px;text-align:center;text-wrap:balance}
.fra{display:block;width:100%;margin-top:16px;padding:14px 14px 12px 16px;border-radius:18px;border:1px solid rgba(230,194,122,.5);background:linear-gradient(rgba(29,98,106,.55),rgba(18,71,77,.35));color:inherit;text-align:left;cursor:pointer}
.fh{display:flex;align-items:center;gap:12px}
.fh .g{flex:1;min-width:0}
.fh .ru{display:block;font-size:15px;line-height:20px}
.fh b{display:block;font-family:var(--se);font-weight:600;font-size:20px;line-height:24px;text-wrap:balance}
.fl{flex:none;color:var(--oro);display:flex}
.ci{display:block;margin-top:4px;font-family:var(--se);font-weight:500;font-size:21px;line-height:28px;text-wrap:pretty}
.fra .ci{margin-top:12px;font-size:19px;line-height:26px}
.fra small{display:block;margin-top:6px;font-size:13px;line-height:18px;color:var(--txt2)}
.fv{display:block;margin-top:10px;padding-top:10px;border-top:1px solid rgba(244,220,166,.2);font-size:14px;line-height:20px;font-weight:600;color:var(--oroc)}
.fra:focus-visible{outline:2px solid var(--oroc);outline-offset:3px}
.his{margin-top:12px;font-size:16px;line-height:25px;color:#DCE6E4}
.tit+.his{margin-top:0}
.fie{margin-top:10px;font-size:14px;line-height:20px;color:var(--txt2);text-wrap:balance}
.ins{text-wrap:balance}
.nb h2{text-wrap:balance}
.pie{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;padding:28px 22px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(rgba(11,50,55,0),#0B3237 42%);z-index:5}
.advg .ni{position:relative}
.pal{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:11px;background:var(--oro);color:var(--manto);display:flex;align-items:center;justify-content:center}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px -22px 0;padding:0 22px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

/* ---------- tacto: todo lo que se toca responde ---------- */

.btn,.it,.ni,.fra,.chip,.avi,.ra,.row,.lk{transition:transform .14s cubic-bezier(.3,.7,.4,1),filter .14s,background-color .2s,border-color .2s,box-shadow .2s,opacity .2s}

.tab svg,.ic svg{transition:transform .14s cubic-bezier(.3,.7,.4,1)}

@keyframes brota{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.35) rotate(8deg)}}

/* ---------- rosario: barra fija, cuentas vivas ---------- */
.ro{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
.ro.sl{padding-bottom:calc(142px + env(safe-area-inset-bottom))}
.rpie{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;padding:26px 22px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(rgba(11,50,55,0),#0B3237 36%);z-index:5}

.ro .ring{margin-top:4px}
@supports (aspect-ratio:1){.ro .ring{width:auto;height:clamp(140px,calc(100vh - 500px),262px);height:clamp(140px,calc(100dvh - 470px),262px);aspect-ratio:260/262;container-type:size}

.ro .ring>div{left:0;right:0;top:50%;width:auto;transform:translateY(-62%)}
.ro .ring b{font-size:clamp(15px,9.6cqw,25px);line-height:1.2}
.ro .ring span{font-size:clamp(12px,5.4cqw,14px)}
@media (max-height:600px){.ro .pr{font-size:17.5px;line-height:24px;margin-top:8px}.ro .rl{min-height:34px;margin-top:0}}
.ro .ring:before{content:"";position:absolute;left:19%;right:19%;top:15%;bottom:23%;border-radius:50%;background:radial-gradient(closest-side,rgba(244,220,166,.17),rgba(244,220,166,0));animation:lumbre 3.9s ease-in-out infinite}
@keyframes lumbre{0%,100%{opacity:.65;transform:scale(1)}23%{opacity:1;transform:scale(1.05)}41%{opacity:.55;transform:scale(.97)}68%{opacity:.95;transform:scale(1.03)}}
@keyframes paso{from{opacity:0;translate:0 9px}}
@keyframes pasoR{from{opacity:0;translate:0 -9px}}
.ro.sg .rt,.ro.sg .ring>div,.ro.sg .rl{animation:paso .3s cubic-bezier(.2,.7,.2,1) backwards}
.ro.at .rt,.ro.at .ring>div,.ro.at .rl{animation:pasoR .3s cubic-bezier(.2,.7,.2,1) backwards}
.ro.mi.sg .rt{animation-duration:.6s}
.ro.mi.sg .rt+.ring+.rt{animation-delay:.18s}
@keyframes prende{0%{transform:scale(2.6);opacity:.25}}
.ro.sg .cur{animation:prende .42s cubic-bezier(.2,.8,.2,1);transform-origin:center;transform-box:fill-box}

/* ---------- la paloma trae el mensaje del día ---------- */
.frw{position:relative}
.dov{position:absolute;right:14px;top:-24px;width:68px;height:53px;pointer-events:none;z-index:3;opacity:0;animation:vuelo 3.4s linear var(--t,0ms) both}
.dov svg{display:block;width:100%;height:100%;overflow:visible}
@keyframes vuelo{0%{opacity:0;transform:translate(250px,-215px) rotate(-14deg) scale(.72);animation-timing-function:cubic-bezier(.22,.8,.3,1)}8%{opacity:1}40%{opacity:1;transform:translate(0,0) rotate(0) scale(1);animation-timing-function:ease-in-out}50%{transform:translate(0,-5px) rotate(0) scale(1);animation-timing-function:ease-in-out}60%{opacity:1;transform:translate(0,0) rotate(0) scale(1);animation-timing-function:cubic-bezier(.5,0,.75,.45)}90%{opacity:1}100%{opacity:0;transform:translate(-340px,-190px) rotate(12deg) scale(.78)}}
.dov .al1,.dov .al2{transform-box:view-box;transform-origin:30px 27px;animation:aleteo .2s ease-in-out 20 alternate}
.dov .al1{animation-delay:var(--t,0ms)}
.dov .al2{animation-delay:calc(var(--t,0ms) - .06s)}
@keyframes aleteo{from{transform:scaleY(1)}to{transform:scaleY(-.6)}}
.dov .carta{transform-box:fill-box;transform-origin:center;animation:carta 3.4s linear var(--t,0ms) both}
@keyframes carta{0%,42%{opacity:1;transform:none}56%{opacity:1;transform:translate(-2px,34px) rotate(-8deg)}63%,100%{opacity:0;transform:translate(-2px,42px) rotate(-8deg)}}
.fra{position:relative}
.fra.trae .ci,.fra.trae small,.fra.trae .fv{animation:llega .75s cubic-bezier(.2,.7,.2,1) calc(var(--t,0ms) + 1.62s) backwards}
@keyframes llega{from{opacity:0;translate:0 8px}}
.fra.trae:after{content:"";position:absolute;inset:-1px;border-radius:18px;pointer-events:none;animation:recibe 1.6s ease-out calc(var(--t,0ms) + 1.5s) backwards}
@keyframes recibe{0%{box-shadow:0 0 0 0 rgba(244,220,166,0)}22%{box-shadow:0 0 0 2px rgba(244,220,166,.5),0 0 36px rgba(244,220,166,.38)}100%{box-shadow:0 0 0 0 rgba(244,220,166,0),0 0 0 rgba(244,220,166,0)}}

@media (prefers-reduced-motion:reduce){.tw,.pu,.bell,.toast,.in>*,.in .tab.on svg,.in .dk .tab.on:before,.ro .rt,.ro .rl,.ro .ring>div,.ro .cur,.ro .ring:before,.ya .pal,.ya .pal2,.ya .md,li.ya .nd svg,.fra.trae .ci,.fra.trae small,.fra.trae .fv,.fra.trae:after{animation:none!important}.dov{display:none}}

.hd .tip.tm{position:absolute;right:-4px;top:calc(100% + 12px);width:min(290px,calc(100vw - 40px));padding:16px 16px 12px 18px;border-radius:18px;background:linear-gradient(180deg,#FFF8E6,#F6E3B4);color:var(--manto);box-shadow:0 18px 40px -12px rgba(0,0,0,.55);text-align:left;animation:tipin .42s cubic-bezier(.2,.8,.2,1) .5s backwards}
.hd .tip.tm:before{content:"";position:absolute;right:18px;top:-8px;width:16px;height:16px;background:#FFF8E6;transform:rotate(45deg);border-radius:4px 0 0 0}
.tipbs{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin-top:10px}
.tipbs .tipok{margin:0}
.tipbs .lk{color:#3E5A5D;font-size:15px}
.hd.htm .ic.mu{border-color:var(--oroc);animation:tipl 1.8s ease-out infinite}
@media (prefers-reduced-motion:reduce){.hd .tip.tm,.hd.htm .ic.mu{animation:none}}
/* ---------- bienvenida: el rosario se enciende dentro del arco ---------- */
@property --bva{syntax:"<angle>";inherits:false;initial-value:0deg}
.bienv{overflow:hidden}
.bvh{justify-content:flex-start;gap:10px;animation:bvf .9s ease both}
.bvh b{font-family:var(--se);font-size:24px;font-weight:600;letter-spacing:.01em}
.bva{position:relative;width:min(94%,370px);aspect-ratio:300/380;margin:6px auto 0;flex:none}
.bva:before{content:"";position:absolute;inset:4% 4% 0;border-radius:200px 200px 0 0;background:radial-gradient(70% 50% at 50% 38%,rgba(244,220,166,.22),rgba(244,220,166,0) 72%),linear-gradient(180deg,rgba(27,100,106,.55),rgba(8,42,47,.15));animation:bvf 1.4s ease .2s both}
.bvarc{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bvarc path{stroke-dasharray:900;stroke-dashoffset:900;animation:bvdr 2.2s cubic-bezier(.6,.1,.2,1) .15s forwards}
.bvr{position:absolute;left:50%;top:-10%;width:170%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(244,220,166,.09) 0 1.6deg,rgba(244,220,166,0) 1.6deg 7.5deg);-webkit-mask-image:radial-gradient(closest-side,#000 30%,transparent 100%);mask-image:radial-gradient(closest-side,#000 30%,transparent 100%);animation:bvf 2s ease 1s both,bvrot 90s linear infinite}
.bvj{position:absolute;left:17%;right:17%;top:4.5%;aspect-ratio:346/634}
.bvj>div{position:absolute;inset:0}
.bvj .jy{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 16px rgba(0,0,0,.45))}
.bv0{animation:bvf 1.2s ease .5s both}
.bv1{-webkit-mask-image:conic-gradient(from 180deg at 50% 64%,#000 var(--bva),transparent calc(var(--bva) + 14deg));mask-image:conic-gradient(from 180deg at 50% 64%,#000 var(--bva),transparent calc(var(--bva) + 14deg));animation:bvsw 4.2s cubic-bezier(.4,0,.6,1) 1s forwards}
.bvch{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:200px 200px 0 0}
.bvch i{position:absolute;bottom:-4%;width:3px;height:3px;border-radius:50%;background:#FBE9BE;box-shadow:0 0 8px 2px rgba(251,233,190,.6);opacity:0;animation:bvup 8s linear infinite}
.bvt{text-align:center;margin-top:6px}
.bvq{font-family:var(--se);font-style:italic;font-weight:500;font-size:31px;line-height:36px;animation:bvin 1.1s cubic-bezier(.2,.8,.2,1) 2.4s both}
.bvs{margin-top:8px;font-size:15px;animation:bvin 1s ease 2.9s both}
.bvd{margin:12px auto 0;max-width:32ch;font-size:16px;line-height:23px;animation:bvin 1s ease 3.2s both}
.bvb{padding-top:18px;animation:bvin .9s ease 3.6s both}
.bvgo{position:relative;overflow:hidden}
.bvgo:after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));transform:skewX(-18deg);animation:bvsh 4.8s ease-in-out 4.4s infinite}
@keyframes bvf{from{opacity:0}}
@keyframes bvin{from{opacity:0;transform:translateY(14px)}}
@keyframes bvdr{to{stroke-dashoffset:0}}
@keyframes bvsw{to{--bva:375deg}}
@keyframes bvrot{to{transform:translateX(-50%) rotate(360deg)}}
@keyframes bvup{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}80%{opacity:.5}100%{opacity:0;transform:translateY(-330px)}}
@keyframes bvsh{0%,60%{left:-40%}100%{left:130%}}
@media (max-height:740px){.bva{width:min(70%,290px)}.bvq{font-size:27px;line-height:32px}.bvd{display:none}}
@media (prefers-reduced-motion:reduce){.bienv *{animation:none!important}.bvarc path{stroke-dashoffset:0}.bv1{-webkit-mask-image:none;mask-image:none}}

.bienv{justify-content:flex-start}
.bienv .bvb{margin-top:auto}
.bv0 .pu,.bv0 .cur,.bv0 [fill="url(#rgl)"]{display:none}
.bv1 [fill="url(#rgl)"]{opacity:.55}
.bv1 .pu{display:none}
/* ---------- onboarding: la decena de cinco pasos ---------- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.obh .obr{position:relative;display:flex;align-items:center;gap:14px;padding:0 4px;color:#C99A45}
.obr .obc{position:absolute;left:4px;right:20px;top:50%;height:1.2px;margin-top:-.6px;background:repeating-linear-gradient(90deg,#D9AE5C 0 3px,transparent 3px 4.4px)}
.obr b{position:relative;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#F6FBFA,#B4CCCA 42%,#5F8486 86%);box-shadow:0 1px 2px rgba(0,0,0,.45);transition:transform .4s}
.obr b.ok{background:radial-gradient(circle at 34% 30%,#FFF9DE,#F6D27A 40%,#CC9631 86%)}
.obr b.on{transform:scale(1.45);background:radial-gradient(circle at 40% 36%,#fff,#FFF4D2 50%,#F3CB78);box-shadow:0 0 0 3px rgba(251,233,190,.18),0 0 14px 4px rgba(244,220,166,.55)}
.obr .obx{position:relative;margin-left:-4px;color:#E6C27A}
/* paso 1: la veladora */
.obv{text-align:center}
.vel{position:relative;width:112px;margin:14px auto 4px;flex:none}
.vel svg{position:relative;display:block;width:100%;height:auto;overflow:visible}
.velh{position:absolute;left:50%;top:-6%;width:330px;aspect-ratio:1;transform:translateX(-50%) scale(.5);border-radius:50%;background:radial-gradient(closest-side,rgba(255,214,140,.38),rgba(255,214,140,.1) 45%,rgba(255,214,140,0));opacity:.25;transition:opacity 1.2s,transform 1.2s}
.vel.lit .velh{opacity:1;transform:translateX(-50%) scale(1)}
.vfg{transform-origin:60px 52px;transform:scale(.42);opacity:.85;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.vel.lit .vfg{transform:scale(1);animation:vfl 2.6s ease-in-out 1s infinite}
.vlu{opacity:.15;transition:opacity 1.2s}
.vel.lit .vlu{opacity:1}
.vimg{opacity:.75}
@keyframes vfl{0%,100%{transform:scale(1) skewX(0)}30%{transform:scale(1.04,.97) skewX(-2deg)}60%{transform:scale(.97,1.05) skewX(1.5deg)}}
.obt{margin-top:6px;font-size:34px;line-height:40px;text-align:center}
.fld.nm{height:66px;margin-top:22px;border:0;border-bottom:1.5px solid var(--oro);border-radius:0;background:none;text-align:center;font-size:36px;padding:0 8px}
.fld.nm:focus-visible{outline:0;border-bottom-color:var(--oroc);box-shadow:0 14px 18px -16px rgba(244,220,166,.8)}
.obg{min-height:26px;margin-top:14px;font-family:var(--se);font-style:italic;font-size:21px;color:var(--oroc);text-align:center;animation:bvin .5s ease both}
/* paso 2: el mapa con tu estado */
.obmap{margin:6px 0 -8px;opacity:.95}
/* paso 4: libro de intenciones */
.lib{margin-top:20px;padding:16px 18px 12px;border-radius:6px 6px 14px 14px;background:linear-gradient(180deg,#FBF3DF,#F1E2BD);color:#2E2414;box-shadow:0 22px 40px -18px rgba(0,0,0,.6),inset 0 0 0 1px rgba(150,110,40,.25),inset 0 0 0 6px rgba(255,255,255,.25)}
.libt{display:flex;align-items:center;gap:8px;font-family:var(--se);font-style:italic;font-size:17px;color:#7A5716;padding-bottom:8px;border-bottom:1px solid rgba(122,87,22,.3)}
.libt span{display:flex;width:22px;color:#9A6E1C}.libt svg{width:22px;height:22px}
.fld.lbt{height:auto;min-height:96px;margin-top:4px;padding:8px 0;border:0;border-radius:0;background:repeating-linear-gradient(180deg,transparent 0 31px,rgba(122,87,22,.22) 31px 32px);color:#2E2414;font-family:var(--se);font-style:italic;font-size:22px;line-height:32px;font-weight:500;resize:none}
.fld.lbt::placeholder{color:rgba(46,36,20,.4)}
.fld.lbt:focus-visible{outline:0}
.libf{margin-top:6px;text-align:right;font-family:var(--se);font-style:italic;font-size:14px;color:#7A5716}
/* paso 5: tu atrio se consagra */
.f5{position:relative;margin-top:6px}
.f5r{position:absolute;left:50%;top:-14%;width:150%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(244,220,166,.1) 0 1.6deg,rgba(244,220,166,0) 1.6deg 7.5deg);-webkit-mask-image:radial-gradient(closest-side,#000 25%,transparent 100%);mask-image:radial-gradient(closest-side,#000 25%,transparent 100%);animation:bvf 1.6s ease 1s both,bvrot 120s linear infinite;pointer-events:none}
.f5n{overflow:hidden}
.f5n .nb{animation:bvin 1s ease 1s both}
.f5p{position:absolute;top:29px;bottom:0;width:calc(50% - 29px);background:linear-gradient(90deg,#0E3E44,#16555C 70%,#0C363B);border-top:1px solid rgba(230,194,122,.5);z-index:3;animation:f5o 1.6s cubic-bezier(.6,0,.2,1) .35s forwards}
.f5pl{left:29px;border-radius:9999px 0 0 0;transform-origin:left;border-right:1px solid rgba(230,194,122,.6)}
.f5pr{right:29px;border-radius:0 9999px 0 0;transform-origin:right;border-left:1px solid rgba(230,194,122,.6);background:linear-gradient(270deg,#0E3E44,#16555C 70%,#0C363B)}
.f5pl{animation-name:f5ol}.f5pr{animation-name:f5or}
@keyframes f5ol{to{transform:perspective(600px) rotateY(82deg);opacity:0}}
@keyframes f5or{to{transform:perspective(600px) rotateY(-82deg);opacity:0}}
.f5b{margin-top:14px;text-align:center;font-family:var(--se);font-style:italic;font-size:21px;line-height:27px;color:var(--oroc);animation:bvin 1s ease 1.6s both}
.fin5 .meds .med{animation:bvin .7s ease both}
.fin5 .tit,.fin5 .pin,.fin5 .sub{animation:bvin .8s ease 1.9s both}
.fin5 .pie{animation:bvin .8s ease 2.2s both}
@media (prefers-reduced-motion:reduce){.vel .vfg,.f5r,.f5n .nb,.f5b,.fin5 *,.obg{animation:none!important}.f5p{display:none}}
/* que las entradas escalonadas de la página no pisen la coreografía */
.v.bienv>.bvh{animation:bvf .9s ease both}
.v.bienv>.bva{animation:none}
.v.bienv>.bvt{animation:none}
.v.bienv>.bvb{animation:bvin .9s ease 3.6s both}

.v.fin5>.f5b{animation:bvin 1s ease 1.6s both}
.v.fin5>.tit,.v.fin5>.pin,.v.fin5>.sub{animation:bvin .8s ease 1.9s both}

.v.fin5>.pie{animation:bvf .8s ease 2.2s both}
@media (prefers-reduced-motion:reduce){.v.bienv>*,.v.fin5>*{animation:none!important}}
